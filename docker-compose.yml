version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: quiz_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
      - monitor_net
    depends_on:
      - web
      - phpmyadmin

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: quiz_web
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quiz_db}
      MYSQL_USER: ${MYSQL_USER:-quiz_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-User@QuizSystem2026!}
    volumes:
      - ./web:/var/www/html
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: quiz_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root@QuizSystem2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quiz_db}
      MYSQL_USER: ${MYSQL_USER:-quiz_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-User@QuizSystem2026!}
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: quiz_pma
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root@QuizSystem2026!}
      PMA_ABSOLUTE_URI: https://192.168.31.128/pma/
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - db

  prometheus:
    image: prom/prometheus:latest
    container_name: quiz_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitor_net

  grafana:
    image: grafana/grafana:latest
    container_name: quiz_grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - monitor_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: quiz_cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitor_net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: quiz_node_exporter
    restart: always
    ports:
      - "9100:9100"
    networks:
      - monitor_net

  loki:
    image: grafana/loki:2.9.2
    container_name: quiz_loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - monitor_net

  promtail:
    image: grafana/promtail:2.9.2
    container_name: quiz_promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitor_net
    depends_on:
      - loki

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitor_net:
    driver: bridge

volumes:
  db_data:
